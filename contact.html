<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <!-- ยกเลิกคำสั่งล็อคการซูมออก กลับมาใช้แบบมาตรฐาน -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ข้อมูลติดต่อเพิ่มเติม</title>

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
      :root {
        /* โทนสี Ocean Aurora (ฟ้าคราม - น้ำเงิน - ม่วง) */
        --bg-color: #f3f8ff;
        --glass-bg: rgba(255, 255, 255, 0.75);
        --glass-border: rgba(255, 255, 255, 1);
        --text-main: #1e293b;
        --text-muted: #64748b;
        --theme-gradient: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
        --icon-bg: #ffffff;

        /* สีแบรนด์ Social Media */
        --fb-color: #1877f2;
        --ig-gradient: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
        --tiktok-color: #0f172a;
        --line-color: #00c300;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Kanit", sans-serif;
      }

      /* ---------------------------------------------------
         MOBILE FIRST BASE STYLES (ค่าเริ่มต้นสำหรับมือถือทุกรุ่น)
         --------------------------------------------------- */
      body {
        background-color: var(--bg-color);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px 15px; /* ลด Padding ในมือถือ */
        overflow-x: hidden; /* ป้องกันหน้าจอเลื่อนซ้ายขวา */
        position: relative;
        -webkit-font-smoothing: antialiased;
      }

      /* กราฟิกแสงออร่า (ลดขนาดในมือถือเพื่อไม่ให้เครื่องหน่วงและล้น) */
      .glow-orb-1,
      .glow-orb-2,
      .glow-orb-3 {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        z-index: 0;
        opacity: 0.5;
      }

      .glow-orb-1 {
        width: 300px; height: 300px;
        background: #00c6ff;
        top: -50px; left: -50px;
        animation: drift 12s infinite alternate ease-in-out;
      }

      .glow-orb-2 {
        width: 250px; height: 250px;
        background: #7f00ff;
        bottom: -50px; right: -50px;
        animation: drift 14s infinite alternate-reverse ease-in-out;
      }

      .glow-orb-3 {
        width: 200px; height: 200px;
        background: #0072ff;
        top: 30%; left: 30%;
        opacity: 0.25;
        animation: drift 10s infinite alternate ease-in-out;
      }

      @keyframes drift {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(20px, -20px) scale(1.05); }
      }

      /* เลย์เอาต์หลัก */
      .main-wrapper {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 500px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 25px; /* ระยะห่างในมือถือ */
      }

      .text-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      /* ไอคอนจรวด */
      .title-icon {
        font-size: 50px; /* ขนาดย่อลงสำหรับมือถือ */
        margin-bottom: 10px;
        display: inline-block;
        background: var(--theme-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 8px 12px rgba(0, 114, 255, 0.3));
        animation: flyingPlane 3s ease-in-out infinite;
      }

      @keyframes flyingPlane {
        0% { transform: translateY(0px) translateX(0px) rotate(0deg); }
        50% { transform: translateY(-6px) translateX(4px) rotate(6deg); }
        100% { transform: translateY(0px) translateX(0px) rotate(0deg); }
      }

      .title {
        /* ใช้ clamp ให้ฟอนต์ปรับขนาดอัตโนมัติตามหน้าจอ (เล็กสุด 26px, ใหญ่สุด 42px) */
        font-size: clamp(26px, 6vw, 42px);
        font-weight: 700;
        white-space: nowrap;
        letter-spacing: 1px;
        background: var(--theme-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* กล่องการ์ดติดต่อ */
      .contact-container {
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 24px;
        border: 1px solid var(--glass-border);
        padding: 25px 20px; /* ลด padding ในมือถือ */
        width: 100%;
        box-shadow: 0 20px 40px rgba(0, 114, 255, 0.05);
        perspective: 1000px;
      }

      .social-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .social-card {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px; /* ระยะห่างระหว่างไอคอนกับข้อความ */
        padding: 15px;
        text-decoration: none;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.8);
        transition: all 0.3s ease;
        position: relative;
        transform-style: preserve-3d;
        will-change: transform;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
      }

      .social-card:hover {
        background: #ffffff;
        box-shadow: 0 10px 25px rgba(0, 114, 255, 0.08);
        transform: translateY(-2px);
        border-color: rgba(0, 114, 255, 0.2);
      }

      .icon-box {
        width: 50px;
        height: 50px;
        border-radius: 14px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 24px;
        background: var(--icon-bg);
        color: var(--text-main);
        transition: all 0.3s ease;
        transform: translateZ(15px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.03);
        flex-shrink: 0; /* ป้องกันไอคอนบีบเบี้ยวในจอเล็ก */
      }

      .info-box {
        text-align: left;
        display: flex;
        flex-direction: column;
        justify-content: center;
        transform: translateZ(10px);
        flex: 1; /* ให้กล่องข้อความขยายเต็มพื้นที่ที่เหลือ */
        min-width: 0; /* ป้องกันข้อความดันกล่องล้น */
      }

      .platform-name {
        color: var(--text-main);
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 2px;
        white-space: nowrap;
      }

      .username {
        font-size: 13px;
        color: var(--text-muted);
        font-weight: 400;
        display: flex;
        align-items: center;
        gap: 6px;
        /* ป้องกันข้อความยาวทะลุจอ ถ้าจอเล็กเกินมันจะขึ้น ... */
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Hover Effects ของแพลตฟอร์มต่างๆ */
      .card-facebook:hover .icon-box { background-color: var(--fb-color); box-shadow: 0 8px 20px rgba(24, 119, 242, 0.3); color: #fff; }
      .card-instagram:hover .icon-box { background: var(--ig-gradient); box-shadow: 0 8px 20px rgba(225, 48, 108, 0.3); color: #fff; }
      .card-tiktok:hover .icon-box { background-color: var(--tiktok-color); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2); color: #fff; }
      .card-line:hover .icon-box { background-color: var(--line-color); box-shadow: 0 8px 20px rgba(0, 195, 0, 0.3); color: #fff; }

      .copy-success .username { color: var(--line-color) !important; font-weight: 600; }
      .copy-success .icon-box { background-color: var(--line-color); color: #fff; }

      /* ---------------------------------------------------
         TABLET & DESKTOP (ขยายขนาดขึ้นเมื่อจอใหญ่กว่า 600px)
         --------------------------------------------------- */
      @media (min-width: 600px) {
        body {
          padding: 40px 20px;
        }

        /* ขยายแสงออร่ากลับมาขนาดเดิม */
        .glow-orb-1 { width: 500px; height: 500px; filter: blur(100px); top: -100px; left: -150px; }
        .glow-orb-2 { width: 450px; height: 450px; filter: blur(100px); bottom: -150px; right: -100px; }
        .glow-orb-3 { width: 350px; height: 350px; filter: blur(100px); top: 40%; left: 40%; }

        .main-wrapper {
          gap: 35px;
        }

        .title-icon {
          font-size: 60px;
          margin-bottom: 15px;
        }

        .title {
          letter-spacing: 2px;
        }

        .contact-container {
          padding: 40px;
          border-radius: 32px;
        }

        .social-grid {
          gap: 16px;
        }

        .social-card {
          padding: 20px 25px;
          gap: 20px;
          border-radius: 20px;
        }

        .social-card:hover {
          transform: translateY(-4px);
        }

        .icon-box {
          width: 60px;
          height: 60px;
          font-size: 28px;
          border-radius: 16px;
        }

        .info-box {
          text-align: center;
          align-items: center; /* บนจอใหญ่จับให้อยู่กึ่งกลางได้สวยงามกว่า */
        }

        .platform-name {
          font-size: 20px;
        }

        .username {
          font-size: 15px;
        }
      }
    </style>
  </head>
  <body>
    <div class="glow-orb-1"></div>
    <div class="glow-orb-2"></div>
    <div class="glow-orb-3"></div>

    <div class="main-wrapper">
      <!-- ส่วนหัว -->
      <div class="text-section">
        <i class="fa-solid fa-paper-plane title-icon"></i>
        <h1 class="title">ช่องทางติดต่อ</h1>
      </div>

      <!-- ส่วนการ์ดติดต่อ -->
      <div class="contact-container">
        <div class="social-grid">
          
          <a href="https://www.facebook.com/share/1BCEvcqLb7/" class="social-card card-facebook" target="_blank">
            <div class="icon-box"><i class="fa-brands fa-facebook-f"></i></div>
            <div class="info-box">
              <div class="platform-name">Facebook</div>
              <div class="username">Chainimit Worawong</div>
            </div>
          </a>

          <a href="https://www.instagram.com/chainimit_nong?igsh=OGQzdGgwbDVjaHp4" class="social-card card-instagram" target="_blank">
            <div class="icon-box"><i class="fa-brands fa-instagram"></i></div>
            <div class="info-box">
              <div class="platform-name">Instagram</div>
              <div class="username">@chainimit_nong</div>
            </div>
          </a>

          <a href="https://www.tiktok.com/@cw_nong01?is_from_webapp=1&sender_device=pc" class="social-card card-tiktok" target="_blank">
            <div class="icon-box"><i class="fa-brands fa-tiktok"></i></div>
            <div class="info-box">
              <div class="platform-name">TikTok</div>
              <div class="username">@cw_nong01</div>
            </div>
          </a>

          <div class="social-card card-line" id="copyLineBtn" data-line-id="jumdo_11234">
            <div class="icon-box"><i class="fa-brands fa-line"></i></div>
            <div class="info-box">
              <div class="platform-name">LINE Official</div>
              <div class="username" id="lineStatusText">
                ID: jumdo_11234 <i class="fa-regular fa-copy"></i>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- ลิงก์ไฟล์ contact.js เหมือนเดิม -->
    <script src="contact.js"></script>
  </body>
</html>
