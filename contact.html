<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ช่องทางติดต่อ</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      :root {
        --bg-color: #f3f8ff;
        --glass-bg: rgba(255, 255, 255, 0.75);
        --glass-border: rgba(255, 255, 255, 1);
        --text-main: #1e293b;
        --text-muted: #64748b;
        --theme-gradient: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
        --icon-bg: #ffffff;

        --fb-color: #1877f2;
        --ig-gradient: linear-gradient(
          45deg,
          #f09433,
          #e6683c,
          #dc2743,
          #cc2366,
          #bc1888
        );
        --tiktok-color: #0f172a;
        --line-color: #00c300;
        --phone-color: #0ea5e9;
        --email-color: #f43f5e;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Kanit", sans-serif;
      }

      html {
        background-color: var(--bg-color);
        width: 100%;
        height: 100%;
      }

      body {
        background-color: var(--bg-color);
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px 15px;
        position: relative;
        -webkit-font-smoothing: antialiased;
      }

      .bg-animation {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 0;
        pointer-events: none;
      }

      .glow-orb-1,
      .glow-orb-2,
      .glow-orb-3 {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.5;
      }

      .glow-orb-1 {
        width: 300px;
        height: 300px;
        background: #00c6ff;
        top: -50px;
        left: -50px;
        animation: drift 12s infinite alternate ease-in-out;
      }
      .glow-orb-2 {
        width: 250px;
        height: 250px;
        background: #7f00ff;
        bottom: -50px;
        right: -50px;
        animation: drift 14s infinite alternate-reverse ease-in-out;
      }
      .glow-orb-3 {
        width: 200px;
        height: 200px;
        background: #0072ff;
        top: 30%;
        left: 30%;
        opacity: 0.25;
        animation: drift 10s infinite alternate ease-in-out;
      }

      @keyframes drift {
        0% {
          transform: translate(0, 0) scale(1);
        }
        100% {
          transform: translate(20px, -20px) scale(1.05);
        }
      }

      .main-wrapper {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 500px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 25px;
        margin: 40px 0;
      }

      .text-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .title-icon {
        font-size: 50px;
        margin-bottom: 10px;
        display: inline-block;
        background: var(--theme-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 8px 12px rgba(0, 114, 255, 0.3));
        animation: flyingPlane 3s ease-in-out infinite;
      }

      @keyframes flyingPlane {
        0% {
          transform: translateY(0px) translateX(0px) rotate(0deg);
        }
        50% {
          transform: translateY(-6px) translateX(4px) rotate(6deg);
        }
        100% {
          transform: translateY(0px) translateX(0px) rotate(0deg);
        }
      }

      .title {
        font-size: clamp(26px, 6vw, 42px);
        font-weight: 700;
        white-space: nowrap;
        letter-spacing: 1px;
        background: var(--theme-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .contact-container {
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 24px;
        border: 1px solid var(--glass-border);
        padding: 25px 20px;
        width: 100%;
        box-shadow: 0 20px 40px rgba(0, 114, 255, 0.05);
        perspective: 1000px;
      }

      .social-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .split-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 12px;
      }

      .social-card {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;
        padding: 15px;
        text-decoration: none;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.8);
        transition: all 0.3s ease;
        position: relative;
        transform-style: preserve-3d;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
      }

      .social-card:hover {
        background: #ffffff;
        box-shadow: 0 10px 25px rgba(0, 114, 255, 0.08);
        transform: translateY(-2px);
      }

      .social-card.split-card {
        flex-direction: column;
        gap: 8px;
        padding: 15px 10px;
      }
      .social-card.split-card .info-box {
        align-items: center;
        text-align: center;
      }
      .social-card.split-card .platform-name {
        font-size: 15px;
      }
      .social-card.split-card .username {
        font-size: 12px;
        justify-content: center;
        width: 100%;
        color: var(--text-main);
      }
      .social-card.split-card .icon-box {
        width: 45px;
        height: 45px;
        font-size: 20px;
      }

      .icon-box {
        width: 50px;
        height: 50px;
        border-radius: 14px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 24px;
        background: var(--icon-bg);
        color: var(--text-main);
        transition: all 0.3s ease;
        transform: translateZ(15px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.03);
        flex-shrink: 0;
      }

      .info-box {
        text-align: left;
        display: flex;
        flex-direction: column;
        justify-content: center;
        transform: translateZ(10px);
        flex: 1;
        min-width: 0;
      }

      .platform-name {
        color: var(--text-main);
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 2px;
        white-space: nowrap;
      }
      .username {
        font-size: 13px;
        color: var(--text-muted);
        font-weight: 400;
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* =========================================
         🌟 เอฟเฟกต์ตัวหนังสือปล่อยคลื่น (Text Wave Animation) 🌟
         ========================================= */
      .wave-text {
        position: relative;
        display: inline-block;
        font-weight: 500;
        z-index: 1;
      }

      .wave-phone {
        color: var(--phone-color);
      }
      .wave-email {
        color: var(--email-color);
      }

      /* สร้างคลื่นซ้อน 2 ชั้นด้วย ::before และ ::after */
      .wave-text::before,
      .wave-text::after {
        content: attr(data-text); /* ดึงข้อความจาก HTML มาทำเป็นคลื่น */
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        opacity: 0;
        pointer-events: none;
      }

      /* แอนิเมชันสำหรับเบอร์โทร */
      .wave-phone::before {
        animation: textRipplePhone 2.5s cubic-bezier(0.165, 0.84, 0.44, 1)
          infinite;
      }
      .wave-phone::after {
        animation: textRipplePhone 2.5s cubic-bezier(0.165, 0.84, 0.44, 1)
          infinite 1.25s;
      }

      @keyframes textRipplePhone {
        0% {
          transform: scale(1);
          opacity: 0.7;
          color: var(--phone-color);
          filter: blur(0px);
        }
        100% {
          transform: scale(1.3);
          opacity: 0;
          color: var(--phone-color);
          filter: blur(2px);
        }
      }

      /* แอนิเมชันสำหรับอีเมล */
      .wave-email::before {
        animation: textRippleEmail 2.5s cubic-bezier(0.165, 0.84, 0.44, 1)
          infinite;
      }
      .wave-email::after {
        animation: textRippleEmail 2.5s cubic-bezier(0.165, 0.84, 0.44, 1)
          infinite 1.25s;
      }

      @keyframes textRippleEmail {
        0% {
          transform: scale(1);
          opacity: 0.7;
          color: var(--email-color);
          filter: blur(0px);
        }
        100% {
          transform: scale(1.3);
          opacity: 0;
          color: var(--email-color);
          filter: blur(2px);
        }
      }

      /* Hover Effects หน้าหลัก */
      .card-facebook:hover .icon-box {
        background-color: var(--fb-color);
        color: #fff;
      }
      .card-instagram:hover .icon-box {
        background: var(--ig-gradient);
        color: #fff;
      }
      .card-tiktok:hover .icon-box {
        background-color: var(--tiktok-color);
        color: #fff;
      }
      .card-line:hover .icon-box,
      .copy-success-line .icon-box {
        background-color: var(--line-color);
        color: #fff;
      }
      .copy-success-line .username {
        color: var(--line-color) !important;
        font-weight: 600;
      }

      .card-phone:hover {
        border-color: rgba(14, 165, 233, 0.3);
      }
      .card-phone:hover .icon-box {
        background-color: var(--phone-color);
        color: #fff;
        box-shadow: 0 8px 20px rgba(14, 165, 233, 0.3);
      }
      .card-phone:hover .username,
      .card-phone:hover .wave-text {
        color: var(--phone-color);
      }

      .card-email:hover {
        border-color: rgba(244, 63, 94, 0.3);
      }
      .card-email:hover .icon-box {
        background-color: var(--email-color);
        color: #fff;
        box-shadow: 0 8px 20px rgba(244, 63, 94, 0.3);
      }
      .card-email:hover .username,
      .card-email:hover .wave-text {
        color: var(--email-color);
      }

      /* =========================================
         MODAL / POPUP STYLES 
         ========================================= */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 999;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }
      .modal-overlay.active {
        opacity: 1;
        pointer-events: auto;
      }

      .modal-content {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        width: 90%;
        max-width: 400px;
        padding: 30px 25px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
        transform: translateY(30px) scale(0.95);
        opacity: 0;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        position: relative;
        max-height: 80vh;
        overflow-y: auto;
      }
      .modal-overlay.active .modal-content {
        transform: translateY(0) scale(1);
        opacity: 1;
      }

      .close-btn {
        position: absolute;
        top: 15px;
        right: 15px;
        width: 35px;
        height: 35px;
        background: rgba(255, 255, 255, 0.5);
        border: none;
        border-radius: 50%;
        font-size: 18px;
        color: var(--text-main);
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: background 0.3s ease;
      }
      .close-btn:hover {
        background: #fff;
        color: #f43f5e;
      }

      .modal-header {
        text-align: center;
        margin-bottom: 25px;
      }
      .modal-header h2 {
        font-size: 22px;
        margin-bottom: 5px;
      }
      .modal-header p {
        color: var(--text-muted);
        font-size: 14px;
      }

      .modal-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .modal-item {
        display: flex;
        align-items: center;
        gap: 15px;
        padding: 12px 15px;
        background: rgba(255, 255, 255, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 16px;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      .modal-item:hover {
        background: #fff;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
      }
      .modal-item .icon-box {
        width: 45px;
        height: 45px;
        font-size: 20px;
        box-shadow: none;
      }
      .modal-item .platform-name {
        font-size: 16px;
        margin-bottom: 0;
      }
      .modal-item .username {
        font-size: 13px;
      }

      .modal-phone:hover {
        border-color: rgba(14, 165, 233, 0.3);
      }
      .modal-phone:hover .icon-box,
      .copy-success-phone .icon-box {
        background-color: var(--phone-color);
        color: #fff;
        border-color: transparent;
      }
      .modal-phone.copy-success-phone .username {
        color: var(--phone-color);
        font-weight: 600;
      }

      .modal-email:hover {
        border-color: rgba(244, 63, 94, 0.3);
      }
      .modal-email:hover .icon-box,
      .copy-success-email .icon-box {
        background-color: var(--email-color);
        color: #fff;
        border-color: transparent;
      }
      .modal-email.copy-success-email .username {
        color: var(--email-color);
        font-weight: 600;
      }

      @media (min-width: 600px) {
        body {
          padding: 40px 20px;
        }
        .glow-orb-1 {
          width: 500px;
          height: 500px;
          filter: blur(100px);
          top: -100px;
          left: -150px;
        }
        .glow-orb-2 {
          width: 450px;
          height: 450px;
          filter: blur(100px);
          bottom: -150px;
          right: -100px;
        }
        .glow-orb-3 {
          width: 350px;
          height: 350px;
          filter: blur(100px);
          top: 40%;
          left: 40%;
        }
        .main-wrapper {
          gap: 35px;
          margin: 0;
        }
        .title-icon {
          font-size: 60px;
          margin-bottom: 15px;
        }
        .contact-container {
          padding: 40px;
          border-radius: 32px;
        }
        .social-card {
          padding: 20px 25px;
          gap: 20px;
          border-radius: 20px;
        }
        .icon-box {
          width: 60px;
          height: 60px;
          font-size: 28px;
          border-radius: 16px;
        }
        .social-card.split-card {
          padding: 20px 15px;
          gap: 15px;
        }
        .social-card.split-card .icon-box {
          width: 55px;
          height: 55px;
          font-size: 26px;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-animation">
      <div class="glow-orb-1"></div>
      <div class="glow-orb-2"></div>
      <div class="glow-orb-3"></div>
    </div>

    <div class="main-wrapper">
      <div class="text-section">
        <i class="fa-solid fa-paper-plane title-icon"></i>
        <h1 class="title">ช่องทางติดต่อ</h1>
      </div>

      <div class="contact-container">
        <div class="social-grid">
          <a
            href="https://www.facebook.com/share/1BCEvcqLb7/"
            class="social-card card-facebook"
            target="_blank"
          >
            <div class="icon-box"><i class="fa-brands fa-facebook-f"></i></div>
            <div class="info-box">
              <div class="platform-name">Facebook</div>
              <div class="username">Chainimit Worawong</div>
            </div>
          </a>

          <a
            href="https://www.instagram.com/chainimit_nong?igsh=OGQzdGgwbDVjaHp4"
            class="social-card card-instagram"
            target="_blank"
          >
            <div class="icon-box"><i class="fa-brands fa-instagram"></i></div>
            <div class="info-box">
              <div class="platform-name">Instagram</div>
              <div class="username">@chainimit_nong</div>
            </div>
          </a>

          <a
            href="https://www.tiktok.com/@cw_nong01?_r=1&_t=ZS-96RGPlIEtHB"
            class="social-card card-tiktok"
            target="_blank"
          >
            <div class="icon-box"><i class="fa-brands fa-tiktok"></i></div>
            <div class="info-box">
              <div class="platform-name">TikTok</div>
              <div class="username">@cw_nong01</div>
            </div>
          </a>

          <div
            class="social-card card-line"
            id="copyLineBtn"
            data-copy-text="jumdo_11234"
          >
            <div class="icon-box"><i class="fa-brands fa-line"></i></div>
            <div class="info-box">
              <div class="platform-name">LINE Official</div>
              <div class="username" id="lineStatusText">
                ID: jumdo_11234 <i class="fa-regular fa-copy"></i>
              </div>
            </div>
          </div>
        </div>

        <div class="split-grid">
          <div class="social-card split-card card-phone" id="openPhoneModalBtn">
            <div class="icon-box">
              <i class="fa-solid fa-mobile-screen"></i>
            </div>
            <div class="info-box">
              <div class="platform-name">Phone</div>
              <div class="username">
                <span class="wave-text wave-phone" data-text="แตะดูเบอร์โทร"
                  >แตะดูเบอร์โทร</span
                >
              </div>
            </div>
          </div>

          <div class="social-card split-card card-email" id="openEmailModalBtn">
            <div class="icon-box">
              <i class="fa-solid fa-envelope-open-text"></i>
            </div>
            <div class="info-box">
              <div class="platform-name">Email</div>
              <div class="username">
                <span class="wave-text wave-email" data-text="แตะดูอีเมล"
                  >แตะดูอีเมล</span
                >
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="dynamicModal">
      <div class="modal-content">
        <button class="close-btn" id="closeModalBtn">
          <i class="fa-solid fa-xmark"></i>
        </button>

        <div class="modal-header">
          <h2 id="modalTitle">หัวข้อ</h2>
          <p>แตะที่รายการเพื่อคัดลอก</p>
        </div>

        <div class="modal-list" id="modalDynamicList"></div>
      </div>
    </div>

    <script src="contact.js"></script>
  </body>
</html>
